[versions]
kotlin = "2.3.0"
slf4j = "2.0.17"
log4j = "2.25.2"

[plugins]
kotlin-jvm = {id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
shadow = {id = "com.gradleup.shadow", version = "9.1.0"}
dotenv = { id = "co.uzzu.dotenv.gradle", version = "4.0.0" }
ssh = { id = "org.hidetake.ssh", version = "2.12.0" }

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin"}
kotlin-coroutine = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version = "1.10.2" }
java-cv = {module = "org.bytedeco:javacv-platform", version = "1.5.12"}
slf4j-api = {group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j"}
log4j-core = {group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j"}
log4j-api = {group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j"}
log4j-impl = {group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j"}